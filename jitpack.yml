jdk:
  - openjdk17

before_install:
  - echo "version=${VERSION}" >> gradle.properties
  - echo "group=com.github.<YourGitHubUser>" >> gradle.properties
  - yes | sdkmanager --licenses || true
  - sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

install:
  - ./gradlew -PskipSigning=true :library:publishReleasePublicationToMavenLocal -x lint -x test